<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d15">
<title>Amazing Thing is Coming Soon | IT Garden</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0b0d15;color:#fff;min-height:100vh;overflow:hidden;position:relative}
#weatherCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.main-wrapper{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(10,20,40,.2),rgba(5,8,15,.9))}
.title{font-size:clamp(2.5rem,8vw,5rem);font-weight:800;letter-spacing:-.02em;line-height:1.1;text-transform:uppercase;background:linear-gradient(135deg,#a0e9ff,#6b8cff 40%,#b985ff 80%);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.5rem;animation:neonFlicker 10s infinite alternate}
@keyframes neonFlicker{0%,18%,22%,25%,53%,57%,100%{text-shadow:0 0 10px #6b8cff99,0 0 20px #6b8cff66,0 0 40px #b985ff4d;opacity:1}20%,24%,55%{text-shadow:none;opacity:.6}21%{text-shadow:2px 0 10px #ff646480,-2px 0 10px #64ffff80;transform:translateX(2px)}23%{text-shadow:-2px 0 10px #ff646480,2px 0 10px #64ffff80;transform:translateX(-2px)}}
.subtitle{font-size:clamp(1.2rem,4vw,1.8rem);font-weight:700;letter-spacing:.4em;margin-bottom:3rem;color:#ffd700;text-transform:uppercase;padding-bottom:.75rem;display:inline-block;position:relative;animation:dynamicYellow 2s infinite alternate ease-in-out}
.subtitle:after{content:'';position:absolute;bottom:0;left:10%;width:80%;height:2px;background:linear-gradient(90deg,transparent,#ffd700,transparent);box-shadow:0 0 15px #ffd700;animation:linePulse 1.5s infinite alternate}
@keyframes dynamicYellow{0%{text-shadow:0 0 5px #ffd70080,0 0 10px #ffd7004d;transform:scale(.98)}100%{text-shadow:0 0 20px #ffd700e6,0 0 40px #ffd70099,0 0 60px #ffd70066;transform:scale(1.02)}}
@keyframes linePulse{0%{opacity:.3;width:50%;left:25%}100%{opacity:1;width:100%;left:0}}
.countdown-container{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin-bottom:3.5rem;background:#141e3280;backdrop-filter:blur(10px);padding:1.5rem 2.5rem;border-radius:80px;border:1px solid #78b4ff40;box-shadow:0 20px 40px #0006,0 0 30px #508cff33}
.countdown-item{display:flex;flex-direction:column;align-items:center;min-width:80px}
.countdown-value{font-size:clamp(2rem,6vw,3.5rem);font-weight:700;background:linear-gradient(to bottom,#fff,#a0c8ff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;font-variant-numeric:tabular-nums;text-shadow:0 0 20px #a0c8ff80}
.countdown-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:#8fa8d0;font-weight:500;margin-top:.25rem}
.contact-info{display:flex;flex-direction:column;gap:.5rem;background:#0f192899;backdrop-filter:blur(8px);padding:1.2rem 2.5rem;border-radius:40px;border:1px solid #6496ff33;box-shadow:0 10px 30px #0008;transition:transform .3s,box-shadow .3s}
.contact-info:hover{transform:translateY(-3px);box-shadow:0 20px 40px #0009,0 0 25px #6496ff4d}
.contact-line{display:flex;align-items:center;justify-content:center;gap:.75rem;font-size:1rem;color:#d0e0ff}
.contact-line a{color:#fff;text-decoration:none;border-bottom:1px dashed #ffffff4d;transition:border-color .2s,color .2s;font-weight:500}
.contact-line a:hover{color:#a0e9ff;border-color:#a0e9ff}
.developer-name{font-weight:700;background:linear-gradient(135deg,#a0e9ff,#b985ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
@media(max-width:600px){.countdown-container{padding:1rem;gap:.5rem;border-radius:40px}.countdown-item{min-width:60px}.contact-info{padding:1rem 1.2rem}.contact-line{font-size:.85rem;flex-direction:column;gap:.2rem;text-align:center}.subtitle{letter-spacing:.2em}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<canvas id="weatherCanvas"></canvas>
<main class="main-wrapper">
<h1 class="title">Amazing Thing</h1>
<div class="subtitle">Coming Soon</div>
<div class="countdown-container" id="countdown">
<div class="countdown-item"><span class="countdown-value" id="days">00</span><span class="countdown-label">Days</span></div>
<div class="countdown-item"><span class="countdown-value" id="hours">00</span><span class="countdown-label">Hours</span></div>
<div class="countdown-item"><span class="countdown-value" id="minutes">00</span><span class="countdown-label">Minutes</span></div>
<div class="countdown-item"><span class="countdown-value" id="seconds">00</span><span class="countdown-label">Seconds</span></div>
</div>
<div class="contact-info">
<div class="contact-line"><span>👤 Contact to developer:</span><span class="developer-name">Nyi Nyi Hmu Htet</span></div>
<div class="contact-line"><span>✉️ Email:</span><a href="mailto:developer@itgarden.online">developer@itgarden.online</a></div>
</div>
</main>
<script>
const targetDate=new Date(Date.now()+6*86400000+12*3600000+22*60000);
const ids=['days','hours','minutes','seconds'].map(id=>document.getElementById(id));
function updateCountdown(){let d=targetDate-Date.now();if(d<0){ids.forEach(el=>el.textContent='00');return}const values=[Math.floor(d/86400000),Math.floor(d%86400000/3600000),Math.floor(d%3600000/60000),Math.floor(d%60000/1000)];values.forEach((v,i)=>ids[i].textContent=String(v).padStart(2,'0'))}
updateCountdown();setInterval(updateCountdown,1000);
const canvas=document.getElementById('weatherCanvas'),ctx=canvas.getContext('2d');let width,height,drops=[],flash=0;const RAIN_COUNT=150;
function resize(){width=canvas.width=innerWidth;height=canvas.height=innerHeight}
class Raindrop{constructor(){this.reset(true)}reset(initial=false){this.x=Math.random()*width;this.y=initial?Math.random()*height:-20;this.length=Math.random()*15+10;this.speed=Math.random()*5+8;this.opacity=Math.random()*.3+.1}update(){this.y+=this.speed;if(this.y>height)this.reset() }draw(){ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(this.x-2,this.y+this.length);ctx.strokeStyle='rgba(180,200,255,'+this.opacity+')';ctx.lineWidth=1.5;ctx.stroke()}}
function createRain(){drops=Array.from({length:RAIN_COUNT},()=>new Raindrop())}
function lightning(){flash=1;document.body.style.backgroundColor='#1a2235';setTimeout(()=>document.body.style.backgroundColor='#0b0d15',100);const t=setInterval(()=>{flash-=.15;if(flash<=0){flash=0;clearInterval(t)}},40)}
setInterval(lightning,1000);
function animate(){ctx.clearRect(0,0,width,height);if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.5)+')';ctx.fillRect(0,0,width,height)}drops.forEach(d=>{d.update();d.draw()});requestAnimationFrame(animate)}
addEventListener('resize',()=>{resize();createRain()});resize();createRain();animate();
</script>
</body></html>
